[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tickfoundry"
version = "0.2.1"
description = "TickFoundry Python SDK: pull historical order-book data for Polymarket, Kalshi and Hyperliquid into pandas, and price executions against the recorded book."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
duckdb = ["duckdb>=1.0"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://tickfoundry.com"
Documentation = "https://tickfoundry.com/docs"

[tool.setuptools.packages.find]
include = ["tickfoundry*", "labcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
